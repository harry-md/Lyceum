[project]
name = "lyceum"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "harry-md", email = "hai.maoduc@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.19.2",
    "asyncpg>=0.31.0",
    "cloudinary>=1.46.2",
    "fastapi[standard-no-fastapi-cloud-cli]>=0.141.1",
    "httpx>=0.28.1",
    "pwdlib[argon2]>=0.3.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.0",
    "pyrefly>=0.60.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.1.0",
    "starlette>=1.7.0",
]

[tool.fastapi]
entrypoint = "lyceum.main:app"

[build-system]
requires = ["uv_build>=0.11.16,<=1.00.00"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.6",
]
